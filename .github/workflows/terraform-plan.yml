name: Terraform plan

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency: terraform-${{ inputs.environment }}
    env:
      TF_VAR_project: ${{ vars.PROJECT }}
      TF_VAR_location: ${{ vars.LOCATION }}
      TF_VAR_replicas: ${{ vars.REPLICAS }}
      TF_VAR_enableExternalIP: ${{ vars.EXTERNAL_IP }}
      # Mock-Credentials, damit der Google-Provider beim Plan nicht meckert
      GOOGLE_APPLICATION_CREDENTIALS: .github/workflows/mock-credentials.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform deployment
        run: terraform plan -input=false -out=local.tfplan

      - name: Annotate Terraform output changes
        shell: bash
        run: |
          output_changes="$(terraform show -no-color local.tfplan | awk '/^Changes to Outputs:/{show=1} show')"
          if [[ -n "$output_changes" ]]; then
            output_changes="${output_changes//'%'/'%25'}"
            output_changes="${output_changes//$'\r'/'%0D'}"
            output_changes="${output_changes//$'\n'/'%0A'}"
            printf '::notice title=Terraform output changes (${{ inputs.environment }})::%s\n' "$output_changes"
          fi
